name: Opportunity Hunter Discovery

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run discovery & scoring
        run: npm run discover

      - name: Commit updated opportunity feed
        run: |
          git config user.name "opportunity-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update discovered opportunities [skip ci]"
            git push
          fi
